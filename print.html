<!doctype html><html lang="id"><head><title>Label pengiriman</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="/js/config.js"></script><script src="/js/app.js"></script>
<style>@page{size:100mm 150mm;margin:4mm}body{font:12px "Courier New",monospace;color:#000}.label{width:92mm}.label h2{margin:0 0 4px;font-size:14px;border-bottom:2px solid #000}.label section{border:2px solid #000;padding:8px;margin-bottom:6px}</style></head>
<body><div class="label" id="l">Memuat...</div>
<script>
(async () => {
  const { data: o } = await sb.from("orders").select("*").eq("id", new URLSearchParams(location.search).get("id")).maybeSingle();
  if (!o) return l.textContent = "Tidak bisa memuat. Pastikan sudah login sebagai admin.";
  l.innerHTML = "<section><h2>PENGIRIM</h2><b>sixtynineproject</b><br>085171040017<br>Arcamanik, Kota Bandung</section>"
   + "<section><h2>PENERIMA</h2><b style=\"font-size:15px\">" + esc(o.buyer_name) + "</b><br>" + esc(o.buyer_phone) + "<br>" + esc(o.address) + "</section>"
   + "<section><h2>" + o.code + " · " + esc(o.courier || o.shipping_method) + "</h2>" + o.items.map(i => "<div>" + esc(i.name) + " (" + esc(i.size) + ") x" + i.qty + "</div>").join("") + (o.resi ? "<div>Resi: " + esc(o.resi) + "</div>" : "") + "</section>";
  setTimeout(() => print(), 600);
})();
</script></body></html>

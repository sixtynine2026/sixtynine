<!doctype html><html lang="id"><head><title>Masuk - SIXTYNINE PROJECT</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="/js/config.js"></script><script src="/js/app.js"></script></head>
<body><div id="hd"></div><main><div class="wrap tr"><h2 class="ttl"><span id="ttl">MASUK</span></h2>
<form id="f"><label>Email<input name="email" type="email" required></label><label>Password<input name="password" type="password" required minlength="6"></label><button class="btn" id="go">Masuk</button></form>
<p class="alt"><span id="q">Belum punya akun?</span> <a href="#" id="sw">Daftar</a></p></div></main><div id="ft"></div>
<script>
let reg = false; layout();
sw.onclick = e => { e.preventDefault(); reg = !reg; ttl.textContent = reg ? "DAFTAR" : "MASUK"; go.textContent = reg ? "Buat akun" : "Masuk"; q.textContent = reg ? "Sudah punya akun?" : "Belum punya akun?"; sw.textContent = reg ? "Masuk" : "Daftar"; };
f.onsubmit = async e => {
  e.preventDefault(); const d = new FormData(f), email = d.get("email"), password = d.get("password");
  const { data, error } = reg ? await sb.auth.signUp({ email, password }) : await sb.auth.signInWithPassword({ email, password });
  if (error) return alert(error.message === "Invalid login credentials" ? "Email atau password salah" : error.message);
  if (!data.session) return alert("Akun dibuat. Cek email kamu untuk konfirmasi, lalu masuk.");
  if (await isAdmin()) return location.href = "/admin";
  const n = new URLSearchParams(location.search).get("next") || "/";
  location.href = n.startsWith("/") && !n.startsWith("//") ? n : "/";
};
</script></body></html>

<!doctype html><html lang="id"><head><title>Pesanan Saya - SIXTYNINE PROJECT</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="/js/config.js"></script><script src="/js/app.js"></script></head>
<body><div id="hd"></div><main><div class="wrap tr"><h2 class="ttl"><span>PESANAN SAYA</span></h2><div id="list">Memuat...</div></div></main><div id="ft"></div>
<script>
(async () => {
  await layout(); await requireLogin();
  const open = new URLSearchParams(location.search).get("code");
  const [a, b, c] = await Promise.all([sb.from("orders").select("*").order("created_at", { ascending: false }), sb.from("tracking_events").select("*").order("created_at", { ascending: false }), sb.from("payment_methods").select("*")]);
  list.innerHTML = (a.data || []).map(o => {
    const p = (c.data || []).find(x => x.name === o.payment_method), ev = (b.data || []).filter(e => e.order_id === o.id), wait = o.status === "Menunggu Pembayaran" && p;
    return "<details class=\"res\" " + (o.code === open ? "open" : "") + "><summary><b>" + o.code + "</b> · " + o.status + " · " + rp(o.total) + "<br><small>" + new Date(o.created_at).toLocaleDateString("id-ID") + "</small></summary>"
      + (wait ? "<p class=\"note\">Transfer " + rp(o.total) + " ke " + esc(p.name) + " " + esc(p.account_number) + " a.n. " + esc(p.account_name) + ". " + esc(p.note) + "</p>" : "")
      + (wait && p.qris_url ? "<img src=\"" + esc(p.qris_url) + "\" alt=\"QRIS\" style=\"max-width:260px;margin:10px 0\">" : "")
      + "<p>" + esc(o.shipping_method) + (o.resi ? " · Resi " + esc(o.resi) : "") + "</p>" + o.items.map(i => "<p>" + esc(i.name) + " (" + esc(i.size) + ") × " + i.qty + "</p>").join("")
      + "<h3>Perjalanan paket</h3>" + (ev.length ? "<ol class=\"tl\">" + ev.map(e => "<li><small>" + new Date(e.created_at).toLocaleString("id-ID") + "</small><p>" + esc(e.note) + "</p></li>").join("") + "</ol>" : "<p>Belum ada update pengiriman.</p>") + "</details>";
  }).join("") || "<p class=\"empty-txt\">Belum ada pesanan.</p>";
})();
</script></body></html>
